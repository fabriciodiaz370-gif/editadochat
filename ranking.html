<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking — Training y Pádel Miramar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;0,900;1,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080b12;
    --card: #0e121c;
    --card-2: #151a26;
    --line: #1e2433;
    --blue: #3b82f6;
    --blue-glow: rgba(59, 130, 246, 0.4);
    --blue-dim: rgba(59, 130, 246, 0.15);
    --lime: #d2f23a;
    --lime-glow: rgba(210, 242, 58, 0.4);
    --lime-dim: rgba(210, 242, 58, 0.12);
    --white: #f5f5f5;
    --grey: #8a93a6;
    --font-display: 'Montserrat', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg) url('hero-banner-padel-bg-blue.png') center/cover no-repeat fixed;
    color: var(--white); font-family: var(--font-body); line-height: 1.5;
  }
  a { color: inherit; text-decoration: none; }
  button, select, input { font-family: var(--font-body); }

  select, input {
    background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; color: var(--white);
    padding: 12px 14px; font-size: 0.9rem; outline: none; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  select:focus, input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 12px var(--blue-glow);
  }

  /* Navbar */
  nav {
    display: flex; align-items: center; justify-content: space-between; padding: 16px 5vw;
    background: rgba(8, 11, 18, 0.85); backdrop-filter: blur(12px); border-bottom: 2px solid var(--blue);
    position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 14px;
    box-shadow: 0 4px 30px rgba(0,0,0,0.5);
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-icon {
    width: 118px; height: 118px; margin: -19px 0; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; position: relative; z-index: 2;
  }
  .brand-name { font-family: var(--font-display); font-weight: 700; font-size: 0.8rem; line-height: 1.3; color: var(--blue); letter-spacing: 0.03em; }
  .brand-name span { display: block; color: var(--white); font-size: 1.22rem; font-weight: 900; letter-spacing: 0.005em; }

  .navlinks { display: none; gap: 30px; font-weight: 700; font-size: 0.8rem; color: var(--white); letter-spacing: 0.05em; }
  .navlinks a { position: relative; padding-bottom: 9px; transition: color 0.2s ease; }
  .navlinks a.active, .navlinks a:hover { color: var(--blue); }
  .navlinks a.active::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px;
    background: var(--blue); border-radius: 2px; box-shadow: 0 0 8px var(--blue-glow);
  }
  @media(min-width:920px) { .navlinks { display: flex; } }

  section{padding:65px 5vw;max-width:1300px;margin:0 auto;}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:16px;border-bottom:1px solid rgba(30, 36, 51, 0.6);padding-bottom:16px;}
  .sec-title{display:flex;align-items:center;gap:12px;font-family:var(--font-display);font-weight:900;font-size:1.4rem;letter-spacing:0.03em;text-transform:uppercase;}
  .sec-title::before{content:'';width:4px;height:24px;background:linear-gradient(180deg, var(--lime), var(--blue));border-radius:2px;display:inline-block;}
  .sec-icon{width:22px;height:22px;color:var(--lime);flex-shrink:0;}
  .sec-note{color:var(--grey);font-size:0.88rem;max-width:38ch;}

  .select-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;}

  .ranking-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .ranking-table th{text-align:left;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--grey);padding:14px 18px;border-bottom:1px solid var(--line);}
  .ranking-table td{padding:14px 18px;border-bottom:1px solid var(--line);font-size:0.92rem;}
  .ranking-table tr:last-child td{border-bottom:none;}
  .ranking-row{cursor:pointer;transition:background 0.15s;}
  .ranking-row:hover td{background:var(--card-2);}
  .puesto{font-family:var(--font-display);font-weight:800;color:var(--grey);}
  .puesto.top{color:var(--lime);}
  .jugador-nombre{font-weight:700;}
  .puntos{font-family:var(--font-display);font-weight:800;color:var(--lime);text-align:right;}

  .avatar-circle{
    width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;
    background:#141a26;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:800;color:var(--lime);border:2px solid var(--line);
  }
  .avatar-circle img{width:100%;height:100%;object-fit:cover;}
  .avatar-circle.big{width:96px;height:96px;font-size:2.1rem;}

  .empty-note{color:var(--grey);font-size:0.9rem;padding:30px;background:var(--card);border:1px dashed var(--line);border-radius:14px;text-align:center;}

  /* Perfil de jugador */
  .perfil-overlay{position:fixed;inset:0;background:rgba(8,11,18,0.8);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;backdrop-filter:blur(4px);}
  .perfil-card{background:linear-gradient(165deg, var(--card) 0%, var(--card-2) 130%);border:1px solid var(--line);border-radius:20px;max-width:520px;width:100%;max-height:86vh;overflow-y:auto;padding:32px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
  .perfil-close{position:absolute;top:16px;right:16px;background:var(--card-2);border:1px solid var(--line);color:var(--white);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;line-height:1;transition:all 0.2s;}
  .perfil-close:hover{border-color:var(--blue);color:var(--blue);}
  .perfil-head{display:flex;align-items:center;gap:18px;margin-bottom:24px;}
  .perfil-nombre{font-family:var(--font-display);font-weight:800;font-size:1.3rem;}
  .perfil-sub{color:var(--grey);font-size:0.85rem;margin-top:2px;}
  .perfil-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px;}
  .perfil-stat{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center;}
  .perfil-stat b{display:block;font-family:var(--font-display);font-size:1.35rem;color:var(--lime);}
  .perfil-stat span{font-size:0.68rem;color:var(--grey);text-transform:uppercase;letter-spacing:0.04em;}
  .perfil-label{font-size:0.72rem;color:var(--grey);text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:10px;}
  .historial-item{padding:12px 0;border-bottom:1px solid var(--line);}
  .historial-item:last-child{border-bottom:none;}
  .historial-item .torneo{font-weight:700;font-size:0.92rem;}
  .historial-item .detalle{font-size:0.8rem;color:var(--grey);margin-top:3px;}
  .historial-item .puesto-tag{color:var(--lime);font-weight:700;}

  footer {
    padding: 35px 5vw; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;
    border-top: 1px solid var(--line); color: var(--grey); font-size: 0.85rem; background: rgba(8, 11, 18, 0.95);
  }
  .footer-brand { display: flex; align-items: center; gap: 16px; }
  .footer-admin{opacity:0.6;transition:opacity 0.2s;font-weight:600;}
  .footer-admin:hover{opacity:1;color:var(--blue);}
</style>
</head>
<body>

<nav>
  <div class="brand">
    <div class="brand-icon">
      <img src="logo.png" alt="Training y Pádel Miramar" style="width:100%;height:100%;object-fit:contain;">
    </div>
    <div class="brand-name">TRAINING Y<span>PÁDEL MIRAMAR</span></div>
  </div>
  <div class="navlinks">
    <a href="index.html">INICIO</a>
    <a href="index.html#proximos">PRÓXIMOS PARTIDOS</a>
    <a href="index.html#llaves">LLAVE DEL TORNEO</a>
    <a href="ranking.html" class="active">RANKING</a>
    <a href="index.html#inscripcion">INSCRIPCIÓN</a>
  </div>
</nav>

<section id="ranking">
  <div class="sec-head">
    <div class="sec-title">
      <svg class="sec-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 21h8M12 17v4M6 4h12v3a6 6 0 01-12 0V4z"/><path d="M6 5H3v2a4 4 0 004 4M18 5h3v2a4 4 0 01-4 4"/></svg>
      RANKING DE JUGADORES
    </div>
    <p class="sec-note">Puntos acumulados por partidos ganados en todo el circuito.</p>
  </div>
  <div class="select-row">
    <select id="rk-categoria"></select>
  </div>
  <div id="ranking-content"></div>
</section>

<footer>
  <div>© 2026 Training y Pádel Miramar. Todos los derechos reservados.</div>
  <div class="footer-brand">
    <a class="footer-admin" href="admin.html">Panel de administración</a>
  </div>
</footer>

<div class="perfil-overlay" id="perfil-overlay">
  <div class="perfil-card" id="perfil-card"></div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import {
  SUPABASE_URL, SUPABASE_ANON_KEY, CATEGORIAS, CATEGORIA_LABEL, LATERALIDADES, POSICION_LABELS,
  loadState, calcularRankingPorCategoria, getJugadorPartidosStats, getAllCategorias, getCategoriaLabel
} from './shared.js?v=5';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let state = null;

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function avatarHtml(j, big){
  const inicial = (j.nombre || '?').trim().charAt(0).toUpperCase();
  const cls = big ? 'avatar-circle big' : 'avatar-circle';
  return `<div class="${cls}">${j.foto ? `<img src="${escapeHtml(j.foto)}" alt="${escapeHtml(j.nombre)}">` : inicial}</div>`;
}

// ---- RANKING DE JUGADORES ----
function populateCategoriaSelect(){
  const sel = document.getElementById('rk-categoria');
  sel.innerHTML = getAllCategorias(state).map(c=>`<option value="${c}">${getCategoriaLabel(state,c)}</option>`).join('');
  sel.onchange = renderRanking;
}

function renderRanking(){
  const cat = document.getElementById('rk-categoria').value;
  const content = document.getElementById('ranking-content');
  const jugadores = state.jugadores || [];
  const ranking = calcularRankingPorCategoria(jugadores, cat).filter(j=>j.puntos>0);

  if(ranking.length===0){
    content.innerHTML = '<div class="empty-note">Todavía no hay puntos cargados en esta categoría.</div>';
    return;
  }

  content.innerHTML = `
    <table class="ranking-table">
      <thead>
        <tr><th>Puesto</th><th>Jugador</th><th style="text-align:center;">Partidos ganados</th><th style="text-align:right;">Puntos</th></tr>
      </thead>
      <tbody>
        ${ranking.map(j=>{
          const stats = getJugadorPartidosStats(state, j.id);
          return `
          <tr class="ranking-row" data-jugador="${j.id}">
            <td class="puesto ${j.puesto<=3?'top':''}">${j.puesto}</td>
            <td>
              <div style="display:flex;align-items:center;gap:12px;">
                ${avatarHtml(j, false)}
                <div class="jugador-nombre">${escapeHtml(j.nombre)}</div>
              </div>
            </td>
            <td style="text-align:center;color:var(--grey);">${stats.ganados}</td>
            <td class="puntos">${j.puntos}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;

  document.querySelectorAll('.ranking-row').forEach(tr=>{
    tr.onclick = ()=> abrirPerfil(tr.dataset.jugador);
  });
}

// ---- PERFIL DE JUGADOR ----
function abrirPerfil(jugadorId){
  const j = (state.jugadores || []).find(x=>x.id===jugadorId);
  if(!j) return;

  const stats = getJugadorPartidosStats(state, j.id);
  const rankingCat = calcularRankingPorCategoria(state.jugadores || [], j.categoria);
  const puntos = rankingCat.find(x=>x.id===j.id)?.puntos || 0;

  const historial = (j.historial || []).slice().sort((a,b)=> new Date(b.fecha) - new Date(a.fecha));

  const historialHtml = historial.length === 0
    ? '<div class="empty-note">Todavía no jugó torneos con resultado.</div>'
    : historial.map(h=>{
        const t = (state.torneos || []).find(tt=>tt.id===h.torneoId);
        const pareja = t ? (t.parejas[h.categoria] || []).find(p=>p.id===h.parejaId) : null;
        const companero = pareja ? (pareja.j1_id === j.id ? pareja.j2 : pareja.j1) : null;
        return `
          <div class="historial-item">
            <div class="torneo">${escapeHtml(t?.nombre || 'Torneo')} <span style="color:var(--grey);font-weight:500;">— ${getCategoriaLabel(state,h.categoria)}</span></div>
            <div class="detalle">
              <span class="puesto-tag">${POSICION_LABELS[h.posicion] || h.posicion}</span>
              ${companero ? ` · con ${escapeHtml(companero)}` : ''} · +${h.puntos_ganados} pts
            </div>
          </div>
        `;
      }).join('');

  document.getElementById('perfil-card').innerHTML = `
    <button class="perfil-close" id="btn-cerrar-perfil">✕</button>
    <div class="perfil-head">
      ${avatarHtml(j, true)}
      <div>
        <div class="perfil-nombre">${escapeHtml(j.nombre)}</div>
        <div class="perfil-sub">${CATEGORIA_LABEL[j.categoria] || j.categoria} · ${LATERALIDADES[j.lateralidad] || ''}</div>
      </div>
    </div>
    <div class="perfil-stats">
      <div class="perfil-stat"><b>${puntos}</b><span>Puntos</span></div>
      <div class="perfil-stat"><b>${stats.ganados}</b><span>Ganados</span></div>
      <div class="perfil-stat"><b>${stats.perdidos}</b><span>Perdidos</span></div>
    </div>
    <div>
      <span class="perfil-label">Historial de torneos</span>
      ${historialHtml}
    </div>
  `;

  document.getElementById('perfil-overlay').style.display = 'flex';
  document.getElementById('btn-cerrar-perfil').onclick = cerrarPerfil;
}

function cerrarPerfil(){
  document.getElementById('perfil-overlay').style.display = 'none';
}

document.getElementById('perfil-overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'perfil-overlay') cerrarPerfil();
});
window.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') cerrarPerfil();
});

// ---- Polling en tiempo real ----
async function pollUpdates(){
  try{
    const newState = await loadState(supabase);
    if(JSON.stringify(state) !== JSON.stringify(newState)){
      state = newState;
      renderRanking();
    }
  }catch(e){
    console.error('Error en polling:', e);
  }
}

(async function init(){
  try{
    state = await loadState(supabase);
    populateCategoriaSelect();
    renderRanking();
    setInterval(pollUpdates, 3000);
  }catch(e){
    console.error(e);
    document.getElementById('ranking-content').innerHTML = '<div class="empty-note">No se pudo conectar con la base de datos.</div>';
  }
})();
</script>

</body>
</html>
